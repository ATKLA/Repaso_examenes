<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Despliegue — Repaso</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&family=Lato:wght@400;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../quiz_shared.css"/>
  <style>
    :root {
      --accent:            #7B52D3;
      --accent-bright:     #B794FF;
      --accent-bg:         rgba(155,109,255,0.12);
      --accent-start-text: #F5F0E8;
    }

    /* Selector de modos */
    .mode-selector {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      padding: 0.5rem;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 0.5rem;
    }

    .btn-mode {
      flex: 1;
      padding: 0.75rem;
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 0.375rem;
      color: var(--muted);
      font-family: var(--font-m);
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.25rem;
    }

    .btn-mode:hover {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
    }

    .btn-mode.active {
      background: var(--accent-bg);
      border-color: var(--accent);
      color: var(--accent-bright);
    }

  </style>
</head>
<body>
<header class="header">
  <a href="../index.html" class="btn-back">
    <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
    Inicio
  </a>
  <span class="header-title">DESPLIEGUE</span>
  <span class="header-tag">0614</span>
</header>
<main class="main">
  <div id="panel-config">
    <div class="config-card">
      <h1 class="config-title">Despliegue de Aplicaciones Web</h1>
      <p class="config-sub">ELIGE MODO Y UNIDADES</p>

      <!-- SELECTOR DE MODO (Temario vs Test) -->
      <p class="section-label">Modo de práctica</p>
      <div class="mode-selector">
        <button class="btn-mode active" data-mode="test">
          <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
          </svg>
          Ejercicios test
        </button>
      </div>
<!-- SELECTOR DE UFs (solo visible en modo test) -->
      <div id="uf-section">
        <p class="section-label">Unidades formativas</p>
        <button class="btn-todo" id="btn-todo">
          <span class="todo-icon">★</span> Todas las UFs
        </button>
        <div class="uf-grid">
          <button class="btn-uf" data-uf="UF1"><span class="tag">UF1</span>DNS y dominios<span class="uf-count" id="count-UF1"></span></button>
          <button class="btn-uf" data-uf="UF2"><span class="tag">UF2</span>Servidores web (Apache/Nginx)<span class="uf-count" id="count-UF2"></span></button>
          <button class="btn-uf" data-uf="UF3"><span class="tag">UF3</span>FTP, SSH y acceso remoto<span class="uf-count" id="count-UF3"></span></button>
          <button class="btn-uf" data-uf="UF4"><span class="tag">UF4</span>Docker y contenedores<span class="uf-count" id="count-UF4"></span></button>
          <button class="btn-uf" data-uf="UF5"><span class="tag">UF5</span>CI/CD y despliegue cloud<span class="uf-count" id="count-UF5"></span></button>
        </div>
      </div>

      <div id="quiz-controls">
        <p class="section-label">Número de preguntas</p>
        <div class="cantidad-grid">
          <button class="btn-cantidad" data-n="10">10</button>
          <button class="btn-cantidad" data-n="20">20</button>
          <button class="btn-cantidad" data-n="30">30</button>
        </div>
        <div style="font-family:var(--font-m);font-size:0.7rem;color:var(--muted);margin-bottom:1.25rem;text-align:right" id="pool-info"></div>
        <button class="btn-start" id="btn-start">Comenzar cuestionario →</button>
      </div>
    </div>
  </div>
  <div id="panel-quiz">
    <div class="quiz-meta">
      <span class="quiz-counter" id="quiz-counter">Pregunta 1 de 10</span>
      <span class="quiz-live-score"><span class="lsc-ok" id="lsc-ok">✓ 0</span><span class="lsc-ko" id="lsc-ko">✗ 0</span></span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
    <div class="q-card">
      <div class="q-card-header"><span class="q-uf-pill" id="q-uf-pill">UF1</span><span class="q-num" id="q-num">1/10</span></div>
      <div class="q-body"><p class="q-text" id="q-text"></p></div>
      <div class="options" id="options"></div>
      <div class="explanation" id="explanation"></div>
    </div>
    <div class="quiz-nav"><button class="btn-nav" id="btn-siguiente">Siguiente →</button></div>
  </div>
  <div id="panel-results">
    <div class="results-card">
      <p class="res-eyebrow">RESULTADO FINAL</p>
      <div class="res-pct" id="res-pct">0%</div>
      <div class="nota-final"><span class="nota-num" id="nota-num">0.0</span><span id="nota-label" style="font-family:var(--font-m);font-size:0.8rem;color:var(--muted)"></span></div>
      <div class="res-badge" id="res-badge">—</div>
      <div class="res-stats">
        <div class="stat"><div class="stat-n" id="res-ok" style="color:var(--accent-bright)">0</div><div class="stat-l">Correctas</div></div>
        <div class="stat"><div class="stat-n" id="res-ko" style="color:var(--ko-text)">0</div><div class="stat-l">Incorrectas</div></div>
        <div class="stat"><div class="stat-n" id="res-sinresp" style="color:var(--muted)">0</div><div class="stat-l">Sin resp.</div></div>
      </div>
      <div class="recomendaciones">
        <div class="rec-title">
          <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/></svg>
          Análisis y recomendaciones
        </div>
        <div class="rec-items" id="rec-items"></div>
      </div>
      <div class="res-actions">
        <button class="btn-res primary" id="btn-repetir">↺ Repetir mismo test</button>
        <button class="btn-res" id="btn-nuevo">⟳ Nuevo cuestionario</button>
        <button class="btn-res ghost" id="btn-volver">← Volver al inicio</button>
      </div>
    </div>
  </div>
</main>
<script src="despliegue_preguntas.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    // Contar preguntas de test por UF
    Object.keys(BANCO).forEach(uf => {
      const el = document.getElementById('count-' + uf);
      if (el) el.textContent = BANCO[uf].length;
    });
    const btnsModo = document.querySelectorAll('.btn-mode');
    const ufSection = document.getElementById('uf-section');
    const temarioSection = document.getElementById('temario-section');
    const quizControls = document.getElementById('quiz-controls');

    btnsModo.forEach(btn => {
      btn.addEventListener('click', () => {
        btnsModo.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const modo = btn.dataset.mode;

        // Mostrar/ocultar secciones según el modo
        if (modo === 'temario') {
          ufSection.style.display = 'none';
          temarioSection.classList.add('visible');
          quizControls.style.display = 'none';
        } else {
          ufSection.style.display = 'block';
          temarioSection.classList.remove('visible');
          quizControls.style.display = 'block';
        }
      });
    });
  });
</script>
<script>window.QUIZ_KEY = "despliegue";</script>
<script src="../quiz_app.js"></script>
</body>
</html>
